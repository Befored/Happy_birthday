      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff9c4" stop-opacity="0.95"/>
